plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'com.northdesigner.mob'
    compileSdk 35
    defaultConfig {
        applicationId 'com.northdesigner.mob'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs = [file('../web').isDirectory() ? '../web' : '../../../dist']
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
